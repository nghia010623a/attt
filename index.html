<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao Diện Chat & Gửi File Mã Hóa</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 30px; }
        .chat-area { width: 500px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; }
        #box { border: 1px solid #ddd; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 15px; background: #fff; border-radius: 4px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; width: fit-content; max-width: 70%; word-break: break-all; }
        .incoming { background: #e2e8f0; align-self: flex-start; }
        .outgoing { background: #3182ce; color: white; align-self: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .action-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .file-label { padding: 10px; background: #e2e8f0; border-radius: 4px; cursor: pointer; text-align: center; font-size: 14px; }
        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .download-lnk { color: #3182ce; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div class="chat-area">
    <h3>Cửa Sổ Chat Bảo Mật (Hỗ trợ gửi File)</h3>
    <div id="box"></div>
    
    <div class="input-group">
        <div class="action-row">
            <input type="text" id="inp" placeholder="Nhập tin nhắn..." disabled>
            <button id="btn-send" onclick="sendText()" disabled>Gửi</button>
        </div>
        <div class="action-row">
            <label class="file-label" style="flex: 1;">
                📁 Chọn hình ảnh / tài liệu để gửi...
                <input type="file" id="file-inp" onchange="sendFile()" style="display: none;" disabled>
            </label>
        </div>
    </div>
</div>

<script>
    const ws = new WebSocket("wss://straticulate-obtusely-ernesto.ngrok-free.dev/nghiaws");
    const box = document.getElementById('box');
    const inp = document.getElementById('inp');
    const btnSend = document.getElementById('btn-send');
    const fileInp = document.getElementById('file-inp');

    showMsg("Hệ thống: Đang kết nối server qua Ngrok...", 'incoming');

    ws.onopen = () => {
        showMsg("Hệ thống: Đã thông suốt! Bạn có thể nhắn tin hoặc gửi file.", 'incoming');
        inp.disabled = false;
        btnSend.disabled = false;
        fileInp.disabled = false;
    };

    ws.onmessage = (event) => {
        let res = JSON.parse(event.data);
        if (res.type === "FILE") {
            showFileMsg(res.text, res.name, 'incoming');
        } else {
            showMsg(res.text, 'incoming');
        }
    };

    ws.onerror = () => showMsg("Hệ thống: Lỗi kết nối, kiểm tra lại Ngrok!", 'incoming');
    ws.onclose = () => showMsg("Hệ thống: Mất kết nối.", 'incoming');

    // 1. Xử lý gửi tin nhắn Text
    function sendText() {
        let text = inp.value.trim();
        if(!text) return;
        
        showMsg(text, 'outgoing');
        ws.send(JSON.stringify({ type: "TEXT", data: text }));
        inp.value = '';
    }

    // 2. Xử lý đọc file và biến đổi sang Base64 để gửi đi
    function sendFile() {
        const file = fileInp.files[0];
        if (!file) return;

        showMsg(`Đang gửi file: ${file.name}...`, 'outgoing');

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result; // Định dạng: data:image/png;base64,iVBORw...
            
            // Hiển thị ngay trên màn hình người gửi
            showFileMsg(base64Data, file.name, 'outgoing');
            
            // Bắn chuỗi Base64 này lên server xử lý mã hóa
            ws.send(JSON.stringify({
                type: "FILE",
                name: file.name,
                data: base64Data
            }));
            fileInp.value = ''; // Reset input file
        };
        reader.readAsDataURL(file);
    }

    // Hàm hiển thị tin nhắn chữ thường
    function showMsg(text, type) {
        let d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = text;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    // Hàm hiển thị tin nhắn chứa File (Ảnh hoặc Link tải)
    function showFileMsg(base64Data, fileName, type) {
        let d = document.createElement('div');
        d.className = `msg ${type}`;

        // Nếu là file ảnh thì hiển thị trực tiếp ảnh ra màn hình chat
        if (base64Data.startsWith("data:image/")) {
            let img = document.createElement('img');
            img.src = base64Data;
            img.className = "chat-img";
            d.appendChild(document.createTextNode(`${type === 'outgoing' ? 'Bạn' : 'Đối phương'} đã gửi ảnh:`));
            d.appendChild(img);
        } else {
            // Nếu là tài liệu (pdf, docx, zip...) thì tạo link tải về
            let lnk = document.createElement('a');
            lnk.href = base64Data;
            lnk.download = fileName;
            lnk.className = "download-lnk";
            lnk.innerText = `📥 Tải file: ${fileName}`;
            d.appendChild(lnk);
        }

        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
